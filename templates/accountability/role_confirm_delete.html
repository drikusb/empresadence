{% extends "base.html" %}
{% block page_title %}Remove Accountability{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">

        <div class="d-flex align-items-center mb-4">
            <a href="{% url 'accountability:chart' %}" class="btn btn-sm btn-outline-secondary me-3">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h1 class="h3 mb-0">Remove Accountability</h1>
        </div>

        <div class="card border-0 shadow-sm" style="border-left: 4px solid var(--bs-danger) !important;">
            <div class="card-body p-4">
                <div class="d-flex align-items-start mb-4">
                    <div class="rounded-circle bg-danger bg-opacity-10 p-2 me-3 flex-shrink-0">
                        <i class="bi bi-exclamation-triangle-fill text-danger fs-5"></i>
                    </div>
                    <div>
                        <h5 class="mb-1">Remove this accountability?</h5>
                        <div class="bg-light rounded p-2 small">
                            <i class="bi bi-dot me-1"></i>{{ object.description }}
                        </div>
                        <p class="text-muted mt-2 mb-0 small">
                            {{ terms.seat }}: <strong>{{ object.node.name }}</strong>
                        </p>
                    </div>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash me-1"></i>Yes, Remove It
                        </button>
                        <a href="{% url 'accountability:chart' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
